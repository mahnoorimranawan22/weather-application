<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0e1a"/>

  <!-- Sun rays -->
  <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="22" y1="14" x2="22" y2="10"/>
    <line x1="14" y1="22" x2="10" y2="22"/>
    <line x1="11.5" y1="14.5" x2="8.5" y2="11.5"/>
    <line x1="14.5" y1="29.5" x2="10.5" y2="31"/>
    <line x1="29.5" y1="11.5" x2="31" y2="7.5"/>
  </g>

  <!-- Sun body -->
  <circle cx="22" cy="24" r="9" fill="#fbbf24"/>

  <!-- Cloud shadow/depth -->
  <rect x="14" y="34" width="38" height="18" rx="9" fill="#1e274a" opacity="0.4"/>

  <!-- Main cloud body -->
  <ellipse cx="32" cy="42" rx="18" ry="10" fill="#e0e7ff"/>
  <!-- Cloud bumps -->
  <circle cx="22" cy="38" r="9" fill="#e0e7ff"/>
  <circle cx="34" cy="35" r="11" fill="#f0f4ff"/>
  <circle cx="45" cy="39" r="8" fill="#e0e7ff"/>
</svg>
